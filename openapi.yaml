    EditUserRequest:
      type: object
      required:
        - editor
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - STAFF
            - MANAGER
