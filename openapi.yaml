        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        branchId:
          type: integer
          format: int64
          minimum: 1
          default: 1
          description: Branch ID to assign the user to.
    RegisterUserWithEditorRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
        - editor
      properties:
        email:
          type: string
          format: email
          description: Email address for the new user.
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        editor:
          $ref: '#/components/schemas/EditorCredentials'
          description: Manager credentials required for authorization.
    ManagerAuthRequest:
      type: object
      required:
        - editor
      properties:
        editor:
          $ref: '#/components/schemas/EditorCredentials'
          description: Manager credentials required for authorization.
    AuthenticateRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          description: User password for authentication.
    UserInfo:
      type: object
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        branchId:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
