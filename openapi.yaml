openapi: 3.0.3
info:
  title: Street Bucks API
  version: 1.0.0
  description: >-
    OpenAPI specification for the Street Bucks NestJS backend. It documents
    the available endpoints exposed by the menu, order, user, insight, branch, stock, recipe, ingredient, and asset controllers.
servers:
  - url: http://localhost:8085
    description: Local development server
tags:
  - name: Assets
    description: Static file serving endpoints for menus and recipes.
  - name: Branches
    description: Branch authentication and management endpoints.
  - name: Ingredients
    description: Ingredient management endpoints.
  - name: Insights
    description: Insight and analytics endpoints. Requires branch authorization.
  - name: Menus
    description: Menu catalogue endpoints.
  - name: Orders
    description: Order management endpoints. Requires branch authorization.
  - name: Recipes
    description: Recipe management endpoints.
  - name: Stocks
    description: Stock/inventory management endpoints. Requires branch authorization.
  - name: Users
    description: User administration and attendance endpoints.
paths:
  # ── Assets ──────────────────────────────────────────────────────────────
  /assets/menus/{filename}:
    get:
      tags:
        - Assets
      summary: Retrieve a menu image by filename
      operationId: getMenuImage
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: The filename of the menu image (e.g., espresso.png).
      responses:
        '200':
          description: Menu image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Menu image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /assets/recipes/{filename}:
    get:
      tags:
        - Assets
      summary: Retrieve a recipe image by filename
      operationId: getRecipeImage
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: The filename of the recipe image (e.g., espresso_shot.png).
      responses:
        '200':
          description: Recipe image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Recipe image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Branches ────────────────────────────────────────────────────────────
  /branches/sign-in:
    post:
      tags:
        - Branches
      summary: Sign in to a branch and receive a JWT token
      operationId: signInBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInBranchRequest'
      responses:
        '200':
          description: Branch signed in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInBranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /branches:
    post:
      tags:
        - Branches
      summary: Create a new branch
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: createBranch
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '200':
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Ingredients ─────────────────────────────────────────────────────────
  /ingredients:
    get:
      tags:
        - Ingredients
      summary: List all ingredients
      operationId: getIngredientList
      responses:
        '200':
          description: Ingredient list retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngredientListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Ingredients
      summary: Update amounts of ingredients for menus
      description: >-
        Requires branch-token header (AuthorizeBranch middleware) and manager
        editor credentials in the request body (AuthorizeManager middleware).
      operationId: editIngredientAmounts
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/EditAmountRequest'
      responses:
        '200':
          description: Ingredient amounts updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ingredients/{name}:
    get:
      tags:
        - Ingredients
      summary: Retrieve ingredients for a specific menu
      operationId: getMenuIngredients
      parameters:
        - in: path
          name: name
          required: true
          description: Name of the menu to get ingredients for.
          schema:
            type: string
      responses:
        '200':
          description: Menu ingredients retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuIngredientsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Insights ────────────────────────────────────────────────────────────
  /insights/sales-today:
    get:
      tags:
        - Insights
      summary: Retrieve the number of orders placed today
      operationId: getSalesToday
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Sales count for today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesCountResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-this-week:
    get:
      tags:
        - Insights
      summary: Retrieve the number of orders placed this week
      operationId: getSalesThisWeek
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Sales count for this week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesCountResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-this-month:
    get:
      tags:
        - Insights
      summary: Retrieve the number of orders placed this month
      operationId: getSalesThisMonth
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Sales count for this month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesCountResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/top-menus-by-quantity:
    get:
      tags:
        - Insights
      summary: Retrieve top selling menu items ranked by quantity sold
      operationId: getTopMenusByQuantity
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Top 5 sold menus by quantity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightTopMenusResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/top-menus-by-revenue:
    get:
      tags:
        - Insights
      summary: Retrieve top selling menu items ranked by revenue
      operationId: getTopMenusByRevenue
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Top 5 sold menus by revenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightTopMenusResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-in-week:
    get:
      tags:
        - Insights
      summary: Retrieve sales counts grouped by day for the current week
      operationId: getSalesInWeek
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Daily sales for the current week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesSeriesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-in-month:
    get:
      tags:
        - Insights
      summary: Retrieve sales counts grouped by day for the current month
      operationId: getSalesInMonth
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Daily sales for the current month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesSeriesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-in-year:
    get:
      tags:
        - Insights
      summary: Retrieve sales counts grouped by menu category for each month of the current year
      operationId: getSalesInYear
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Monthly sales grouped by menu category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesByCategoryResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Menus ───────────────────────────────────────────────────────────────
  /menus/hot:
    get:
      tags:
        - Menus
      summary: List all available hot beverages
      operationId: listHotMenus
      responses:
        '200':
          description: Hot beverages currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/iced:
    get:
      tags:
        - Menus
      summary: List all available iced beverages
      operationId: listIcedMenus
      responses:
        '200':
          description: Iced beverages currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/bakery:
    get:
      tags:
        - Menus
      summary: List all available bakery menus
      operationId: listBakeryMenus
      responses:
        '200':
          description: Bakery menus currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/form/{name}:
    get:
      tags:
        - Menus
      summary: Retrieve the edit form data for a specific menu
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: getMenuForm
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: path
          name: name
          required: true
          description: Name of the menu.
          schema:
            type: string
      responses:
        '200':
          description: Menu form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuFormResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/remove/{name}:
    delete:
      tags:
        - Menus
      summary: Remove a menu item and its associated image
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: removeMenu
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: path
          name: name
          required: true
          description: Name of the menu to remove.
          schema:
            type: string
      responses:
        '200':
          description: Menu removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/{name}:
    get:
      tags:
        - Menus
      summary: Retrieve a specific menu by its name
      operationId: getMenuByName
      parameters:
        - in: path
          name: name
          required: true
          description: Name of the menu.
          schema:
            type: string
      responses:
        '200':
          description: Specific menu information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Menus
      summary: Update a specific menu by its name
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: editMenuByName
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: path
          name: name
          required: true
          description: Name of the menu to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMenuRequest'
      responses:
        '200':
          description: Menu updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus:
    get:
      tags:
        - Menus
      summary: List all available menus
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: listAllMenus
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      responses:
        '200':
          description: All menus currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Menus
      summary: Add a new menu item with an image
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: addMenu
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - category
                - file
              properties:
                name:
                  type: string
                  description: Name of the menu item.
                price:
                  type: number
                  format: double
                  minimum: 0
                  description: Price of the menu item.
                category:
                  type: string
                  enum:
                    - HOT
                    - ICED
                    - BAKERY
                  description: Category of the menu.
                file:
                  type: string
                  format: binary
                  description: Image file for the menu (jpg, jpeg, png, gif, webp).
      responses:
        '201':
          description: Menu added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Menu with the provided name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Orders ──────────────────────────────────────────────────────────────
  /orders:
    post:
      tags:
        - Orders
      summary: Create a new order from the provided cart items
      description: Requires a valid branch-token header for authorization.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderRequestItem'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Orders
      summary: List orders placed during the current day
      description: Requires a valid branch-token header for authorization.
      operationId: listTodayOrders
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Orders placed during the current day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/find/{uuid}:
    get:
      tags:
        - Orders
      summary: Find an order by UUID without branch scope restriction
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: getOrderByUuid
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: path
          name: uuid
          required: true
          description: Order identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Found order information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderFoundResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/receipt/{uuid}:
    get:
      tags:
        - Orders
      summary: Retrieve PDF receipt for a specific order
      description: Requires a valid branch-token header for authorization.
      operationId: getOrderReceipt
      parameters:
        - $ref: '#/components/parameters/BranchToken'
        - in: path
          name: uuid
          required: true
          description: Order identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF receipt file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{uuid}:
    get:
      tags:
        - Orders
      summary: Retrieve details for a specific order
      description: Requires a valid branch-token header for authorization.
      operationId: getOrderDetails
      parameters:
        - $ref: '#/components/parameters/BranchToken'
        - in: path
          name: uuid
          required: true
          description: Order identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Recipes ─────────────────────────────────────────────────────────────
  /recipes:
    get:
      tags:
        - Recipes
      summary: List all available recipes
      operationId: listRecipes
      responses:
        '200':
          description: All recipes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Recipes
      summary: Add a new recipe with an image
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: addRecipe
      parameters:
        - $ref: '#/components/parameters/AdminToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - unit
                - file
              properties:
                name:
                  type: string
                  description: Name of the recipe.
                unit:
                  type: string
                  description: Unit of measurement for the recipe.
                file:
                  type: string
                  format: binary
                  description: Image file for the recipe (jpg, jpeg, png, gif, webp).
      responses:
        '201':
          description: Recipe added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Recipe with the provided name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recipes/{name}:
    put:
      tags:
        - Recipes
      summary: Update a recipe by its name
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: editRecipeByName
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: path
          name: name
          required: true
          description: Name of the recipe to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRecipeRequest'
      responses:
        '200':
          description: Recipe updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Recipe with the new name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Recipes
      summary: Remove a recipe by its name
      description: >-
        Requires admin-token header (AuthorizeAdministrator middleware).
        Will fail with 403 if the recipe is used as an ingredient in any menu.
      operationId: removeRecipe
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: path
          name: name
          required: true
          description: Name of the recipe to remove.
          schema:
            type: string
      responses:
        '200':
          description: Recipe removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Recipe is used as an ingredient in existing menus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Stocks ──────────────────────────────────────────────────────────────
  /stocks:
    get:
      tags:
        - Stocks
      summary: Get all stock items for the branch
      description: Requires a valid branch-token header for authorization.
      operationId: getBranchStocks
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Stock items for the branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchStocksResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Stocks
      summary: Update stock quantity for a recipe at the branch
      description: Requires a valid branch-token header for authorization.
      operationId: editStockQuantity
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditQuantityRequest'
      responses:
        '200':
          description: Stock quantity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Users ───────────────────────────────────────────────────────────────
  /users/administrator/sign-in:
    post:
      tags:
        - Users
      summary: Sign in as an administrator and receive a JWT token
      operationId: signInAdministrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialsRequest'
      responses:
        '200':
          description: Administrator signed in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInAdministratorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User does not have administrator privileges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/search:
    get:
      tags:
        - Users
      summary: Search for users by first or last name
      description: Requires admin-token header (AuthorizeAdministrator middleware).
      operationId: searchUsersByName
      parameters:
        - $ref: '#/components/parameters/AdminToken'
        - in: query
          name: name
          required: true
          description: Name to search for.
          schema:
            type: string
      responses:
        '200':
          description: Users matching the search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchUsersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/remove/{email}:
    post:
      tags:
        - Users
      summary: Remove the specified user and related records
      description: >-
        Requires manager editor credentials in the request body (AuthorizeManager middleware).
      operationId: removeUser
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user to remove.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerAuthRequest'
      responses:
        '200':
          description: User removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{email}:
    post:
      tags:
        - Users
      summary: Toggle attendance for the specified user
      description: >-
        Requires authentication via password in the request body (AuthenticateUser middleware).
        The user's password must be provided for verification.
      operationId: toggleUserAttendance
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
      responses:
        '200':
          description: Attendance status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Users
      summary: Retrieve form data for the specified user
      operationId: getUserForm
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user.
          schema:
            type: string
            format: email
      responses:
        '200':
          description: User form data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFormResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Users
      summary: Update an existing user's information
      description: >-
        Requires manager editor credentials in the request body (AuthorizeManager middleware).
      operationId: updateUser
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user to update.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    get:
      tags:
        - Users
      summary: Get all users for the branch
      description: Requires a valid branch-token header for authorization.
      operationId: getBranchUsers
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Users for the branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchUsersResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Users
      summary: Register a new user
      description: >-
        Requires branch-token header (AuthorizeBranch middleware for branch context) and
        manager editor credentials in the request body (AuthorizeManager middleware).
      operationId: registerUser
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: User with the provided email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    BranchToken:
      in: header
      name: branch-token
      required: true
      description: JWT token for branch authorization obtained from POST /branches/sign-in.
      schema:
        type: string
    AdminToken:
      in: header
      name: admin-token
      required: true
      description: JWT token for administrator authorization obtained from POST /users/administrator/sign-in.
      schema:
        type: string
  schemas:
    # ── Common ──────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong.
        message:
          type: string
          description: Additional context about the error.
    SimpleMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human readable message.
    EditorCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: Email of the editor (manager).
        password:
          type: string
          minLength: 1
          description: Password of the editor for authorization.
    ManagerAuthRequest:
      type: object
      required:
        - editor
      properties:
        editor:
          $ref: '#/components/schemas/EditorCredentials'
          description: Manager credentials required for authorization.
    # ── Branch ──────────────────────────────────────────────────────────
    SignInBranchRequest:
      type: object
      required:
        - branchId
        - password
      properties:
        branchId:
          type: integer
          format: int64
          description: Branch identifier.
        password:
          type: string
          minLength: 1
          description: Password for the branch.
    SignInBranchResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT token for subsequent authenticated requests via branch-token header.
    CreateBranchRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          description: Password for the new branch.
    # ── Ingredient ──────────────────────────────────────────────────────
    EditAmountRequest:
      type: object
      required:
        - menuId
        - recipeId
        - amount
      properties:
        menuId:
          type: string
          description: Menu name identifier.
        recipeId:
          type: string
          description: Recipe name identifier.
        amount:
          type: integer
          format: int32
          minimum: 0
          description: New amount for the ingredient.
    IngredientListResponse:
      type: object
      required:
        - message
        - ingredient_list
      properties:
        message:
          type: string
        ingredient_list:
          type: array
          items:
            type: object
    MenuIngredientsResponse:
      type: object
      required:
        - message
        - menu_ingredients
      properties:
        message:
          type: string
        menu_ingredients:
          type: array
          items:
            type: object
            properties:
              recipeId:
                type: string
              amount:
                type: integer
                format: int32
    # ── Insight ─────────────────────────────────────────────────────────
    InsightSalesCountResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          type: integer
          format: int32
          minimum: 0
          description: Number of orders in the period.
    InsightChartData:
      type: object
      required:
        - labels
        - data
      properties:
        labels:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            type: number
    InsightTopMenusResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          $ref: '#/components/schemas/InsightChartData'
    InsightSalesSeriesResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          $ref: '#/components/schemas/InsightChartData'
    SalesByCategoryItem:
      type: object
      required:
        - label
        - data
      properties:
        label:
          type: string
          description: Menu category (e.g., HOT, ICED, BAKERY).
        data:
          type: array
          maxItems: 12
          items:
            type: integer
            format: int32
            minimum: 0
          description: Monthly sales counts (index 0 = January).
    InsightSalesByCategoryResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          type: array
          items:
            $ref: '#/components/schemas/SalesByCategoryItem'
    # ── Menu ────────────────────────────────────────────────────────────
    MenuSummary:
      type: object
      required:
        - name
        - price
        - imagePath
      properties:
        name:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        category:
          type: string
          enum:
            - HOT
            - ICED
            - BAKERY
        imagePath:
          type: string
        note:
          type: string
          nullable: true
    MenuListResponse:
      type: object
      required:
        - message
        - menus
      properties:
        message:
          type: string
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuSummary'
    MenuResponse:
      type: object
      required:
        - message
        - menu
      properties:
        message:
          type: string
        menu:
          $ref: '#/components/schemas/MenuSummary'
    MenuForm:
      type: object
      required:
        - name
        - price
        - category
      properties:
        name:
          type: string
        price:
          type: number
          format: double
          minimum: 0
        category:
          type: string
          enum:
            - HOT
            - ICED
            - BAKERY
    MenuFormResponse:
      type: object
      required:
        - message
        - menu_form
      properties:
        message:
          type: string
        menu_form:
          $ref: '#/components/schemas/MenuForm'
    EditMenuRequest:
      type: object
      properties:
        name:
          type: string
          description: Updated name of the menu.
        price:
          type: number
          format: double
          minimum: 0
          description: Updated price of the menu.
        category:
          type: string
          enum:
            - HOT
            - ICED
            - BAKERY
          description: Updated category of the menu.
    # ── Order ───────────────────────────────────────────────────────────
    OrderRequestItem:
      type: object
      required:
        - menuId
        - quantity
      properties:
        menuId:
          type: string
          description: Menu name identifier.
        quantity:
          type: integer
          format: int32
          minimum: 1
    OrderCreatedResponse:
      type: object
      required:
        - message
        - order_id
      properties:
        message:
          type: string
        order_id:
          type: string
          format: uuid
    OrderSummary:
      type: object
      required:
        - uuid
        - timestamp
        - totalPrice
      properties:
        uuid:
          type: string
          format: uuid
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds.
        totalPrice:
          type: number
          format: double
          minimum: 0
    OrderListResponse:
      type: object
      required:
        - message
        - today_orders
      properties:
        message:
          type: string
        today_orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
    OrderMenuItem:
      type: object
      required:
        - quantity
        - menu
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 1
        menu:
          type: object
          required:
            - name
            - price
          properties:
            name:
              type: string
            price:
              type: number
              format: double
              minimum: 0
    OrderDetail:
      type: object
      required:
        - uuid
        - totalPrice
        - entry
      properties:
        uuid:
          type: string
          format: uuid
        totalPrice:
          type: number
          format: double
          minimum: 0
        entry:
          type: array
          items:
            $ref: '#/components/schemas/OrderMenuItem'
    OrderDetailResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        order:
          $ref: '#/components/schemas/OrderDetail'
    OrderFoundResponse:
      type: object
      required:
        - message
        - found_order
      properties:
        message:
          type: string
        found_order:
          type: object
          required:
            - uuid
            - branchId
            - timestamp
            - totalPrice
          properties:
            uuid:
              type: string
              format: uuid
            branchId:
              type: integer
              format: int64
            timestamp:
              type: integer
              format: int64
              description: Unix timestamp in milliseconds.
            totalPrice:
              type: number
              format: double
              minimum: 0
    # ── Recipe ──────────────────────────────────────────────────────────
    RecipeListResponse:
      type: object
      required:
        - recipes
      properties:
        recipes:
          type: array
          items:
            type: object
            required:
              - name
              - unit
              - imagePath
            properties:
              name:
                type: string
              unit:
                type: string
              imagePath:
                type: string
    EditRecipeRequest:
      type: object
      required:
        - name
        - unit
      properties:
        name:
          type: string
          description: Updated name for the recipe.
        unit:
          type: string
          description: Updated unit for the recipe.
    # ── Stock ───────────────────────────────────────────────────────────
    EditQuantityRequest:
      type: object
      required:
        - recipeId
        - quantity
      properties:
        recipeId:
          type: string
          description: Recipe name identifier for the stock item.
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: New quantity for the stock.
    BranchStockItem:
      type: object
      required:
        - quantity
        - recipe
      properties:
        quantity:
          type: integer
          format: int32
          minimum: 0
        recipe:
          type: object
          required:
            - name
            - unit
          properties:
            name:
              type: string
            unit:
              type: string
            imagePath:
              type: string
    BranchStocksResponse:
      type: object
      required:
        - message
        - branch_stocks
      properties:
        message:
          type: string
        branch_stocks:
          type: array
          items:
            $ref: '#/components/schemas/BranchStockItem'
    # ── User ────────────────────────────────────────────────────────────
    CredentialsRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    AuthenticateRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          description: User password for authentication.
    SignInAdministratorResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT token for subsequent authenticated requests via admin-token header.
    RegisterUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - password
        - editor
      properties:
        email:
          type: string
          format: email
          description: Email address for the new user.
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
        editor:
          $ref: '#/components/schemas/EditorCredentials'
          description: Manager credentials required for authorization.
    EditUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
        - role
        - editor
      properties:
        email:
          type: string
          format: email
          description: Updated email address.
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        role:
          type: string
          enum:
            - STAFF
            - MANAGER
        password:
          type: string
          minLength: 1
          description: Optional updated password.
        editor:
          $ref: '#/components/schemas/EditorCredentials'
          description: Manager credentials required for authorization.
    UserForm:
      type: object
      required:
        - email
        - firstName
        - lastName
        - role
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - STAFF
            - MANAGER
            - ADMINISTRATOR
    UserFormResponse:
      type: object
      required:
        - message
        - user_form
      properties:
        message:
          type: string
        user_form:
          $ref: '#/components/schemas/UserForm'
    UserEntry:
      type: object
      required:
        - email
        - firstName
        - lastName
        - role
        - branchId
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum:
            - STAFF
            - MANAGER
            - ADMINISTRATOR
        branchId:
          type: integer
          format: int64
    SearchUsersResponse:
      type: object
      required:
        - message
        - found_users
      properties:
        message:
          type: string
        found_users:
          type: array
          items:
            $ref: '#/components/schemas/UserEntry'
    BranchUserItem:
      type: object
      required:
        - firstName
        - lastName
        - email
        - role
        - attended
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - STAFF
            - MANAGER
            - ADMINISTRATOR
        attended:
          type: boolean
    BranchUsersResponse:
      type: object
      required:
        - message
        - branch_users
      properties:
        message:
          type: string
        branch_users:
          type: array
          items:
            $ref: '#/components/schemas/BranchUserItem'
  responses:
    BadRequest:
      description: Client error due to invalid input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication or authorization failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
