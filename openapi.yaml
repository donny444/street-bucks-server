openapi: 3.0.3
info:
  title: Street Bucks API
  version: 1.0.0
  description: >-
    OpenAPI specification for the Street Bucks NestJS backend. It documents
    the available endpoints exposed by the menu, order, user, insight, branch, stock, and recipe controllers.
servers:
  - url: http://localhost:8085
    description: Local development server
tags:
  - name: Assets
    description: Static file serving endpoints for menus, receipts, and recipes.
  - name: Branches
    description: Branch authentication and management endpoints.
  - name: Insights
    description: Insight and analytics endpoints. Requires branch authorization.
  - name: Menus
    description: Menu catalogue endpoints.
  - name: Orders
    description: Order management endpoints. Requires branch authorization.
  - name: Recipes
    description: Recipe management endpoints.
  - name: Stocks
    description: Stock/inventory management endpoints. Requires branch authorization.
  - name: Users
    description: User administration and attendance endpoints.
paths:
  /branches:
    post:
      tags:
        - Branches
      summary: Create a new branch
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Branch created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /branches/signin:
    post:
      tags:
        - Branches
      summary: Sign in to a branch and receive a JWT token
      operationId: signInBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInBranchRequest'
      responses:
        '200':
          description: Branch signed in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInBranchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-today:
    get:
      tags:
        - Insights
      summary: Retrieve the number of orders placed today
      operationId: getSalesToday
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Sales count for today
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesTodayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/top-menus:
    get:
      tags:
        - Insights
      summary: Retrieve insight about top selling menu items
      operationId: getTopMenus
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Top sold menus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightTopMenusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-in-week:
    get:
      tags:
        - Insights
      summary: Retrieve sales counts grouped by day for the current week
      operationId: getSalesInWeek
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Daily sales for the current week
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesSeriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-in-month:
    get:
      tags:
        - Insights
      summary: Retrieve sales counts grouped by day for the current month
      operationId: getSalesInMonth
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Daily sales for the current month
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesSeriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /insights/sales-in-year:
    get:
      tags:
        - Insights
      summary: Retrieve sales counts grouped by menu type for each month of the current year
      operationId: getSalesInYear
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Monthly sales grouped by menu category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightSalesByCategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/hot:
    get:
      tags:
        - Menus
      summary: List all available hot beverages
      operationId: listHotMenus
      responses:
        '200':
          description: Hot beverages currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/iced:
    get:
      tags:
        - Menus
      summary: List all available iced beverages
      operationId: listIcedMenus
      responses:
        '200':
          description: Iced beverages currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/bakery:
    get:
      tags:
        - Menus
      summary: List all available bakery menus
      operationId: listBakeryMenus
      responses:
        '200':
          description: Bakery menus currently available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus:
    post:
      tags:
        - Menus
      summary: Add a new menu item with an image
      description: >-
        Requires authorization via administrator credentials in the request body (AuthorizeAdministrator middleware).
        Only users with ADMINISTRATOR role can add new menus.
      operationId: addMenu
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - price
                - category
                - file
                - editor
              properties:
                name:
                  type: string
                  description: Name of the menu item.
                price:
                  type: number
                  format: float
                  minimum: 0
                  description: Price of the menu item.
                category:
                  type: string
                  description: Category of the menu (e.g., hot, iced, bakery).
                file:
                  type: string
                  format: binary
                  description: Image file for the menu (jpg, jpeg, png, gif, webp).
                editor:
                  type: string
                  description: JSON string containing administrator credentials {email, password}.
      responses:
        '201':
          description: Menu added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Menu with the provided name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /menus/{name}:
    get:
      tags:
        - Menus
      summary: Retrieve a specific menu by its name
      operationId: getMenuByName
      parameters:
        - in: path
          name: name
          required: true
          description: Name of the menu.
          schema:
            type: string
      responses:
        '200':
          description: Specific menu information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Menus
      summary: Update a specific menu by its name
      description: >-
        Requires authorization via administrator credentials in the request body (AuthorizeAdministrator middleware).
        Only users with ADMINISTRATOR role can update menus.
      operationId: editMenuByName
      parameters:
        - in: path
          name: name
          required: true
          description: Name of the menu to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMenuRequest'
      responses:
        '200':
          description: Menu updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders:
    post:
      tags:
        - Orders
      summary: Create a new order from the provided cart items
      description: Requires a valid Branch-Token header for authorization.
      operationId: createOrder
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OrderRequestItem'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Orders
      summary: List orders placed during the current day
      description: Requires a valid Branch-Token header for authorization.
      operationId: listTodayOrders
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      responses:
        '200':
          description: Orders placed during the current day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{uuid}:
    get:
      tags:
        - Orders
      summary: Retrieve details for a specific order
      description: Requires a valid Branch-Token header for authorization.
      operationId: getOrderByUuid
      parameters:
        - $ref: '#/components/parameters/BranchToken'
        - in: path
          name: uuid
          required: true
          description: Order identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order details or informational message when not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{uuid}/receipt:
    get:
      tags:
        - Orders
      summary: Retrieve PDF receipt for a specific order
      description: Requires a valid Branch-Token header for authorization.
      operationId: getOrderReceipt
      parameters:
        - $ref: '#/components/parameters/BranchToken'
        - in: path
          name: uuid
          required: true
          description: Order identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF receipt file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /recipes:
    post:
      tags:
        - Recipes
      summary: Add a new recipe with an image
      description: >-
        Requires authorization via administrator credentials in the request body (AuthorizeAdministrator middleware).
        Only users with ADMINISTRATOR role can add new recipes.
      operationId: addRecipe
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - file
                - editor
              properties:
                name:
                  type: string
                  description: Name of the recipe.
                unit:
                  type: string
                  description: Unit of measurement for the recipe.
                file:
                  type: string
                  format: binary
                  description: Image file for the recipe (jpg, jpeg, png, gif, webp).
                editor:
                  type: string
                  description: JSON string containing administrator credentials {email, password}.
      responses:
        '201':
          description: Recipe added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Recipe with the provided name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /stocks:
    put:
      tags:
        - Stocks
      summary: Update stock quantity for a recipe at the branch
      description: >-
        Requires both Branch-Token header (AuthorizeBranch middleware) and manager credentials
        in the request body (AuthorizeManager middleware). Only users with MANAGER role can update stock.
      operationId: editStockQuantity
      parameters:
        - $ref: '#/components/parameters/BranchToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditQuantityWithEditorRequest'
      responses:
        '200':
          description: Stock quantity updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users:
    post:
      tags:
        - Users
      summary: Register a new user
      description: >-
        Requires authorization via manager credentials in the request body (AuthorizeManager middleware).
        Only users with MANAGER role can register new users.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserWithEditorRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: User with the provided email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/{email}:
    post:
      tags:
        - Users
      summary: Toggle attendance for the specified user
      description: >-
        Requires authentication via password in the request body (AuthenticateUser middleware).
        The user's password must be provided for verification.
      operationId: toggleUserAttendance
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateRequest'
      responses:
        '201':
          description: Attendance status toggled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Users
      summary: Retrieve information for the specified user
      description: >-
        Requires authorization via manager credentials in the request body (AuthorizeManager middleware).
        Only users with MANAGER role can view user information.
      operationId: getUserByEmail
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagerAuthRequest'
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Users
      summary: Update an existing user's information
      description: >-
        Requires authorization via manager credentials in the request body (AuthorizeUser middleware).
        Only users with MANAGER role can update other users.
      operationId: updateUser
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user to update.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Users
      summary: Remove the specified user and related records
      description: >-
        Requires authorization via manager credentials in the request body (AuthorizeUser middleware).
        Only users with MANAGER role can delete other users.
      operationId: deleteUser
      parameters:
        - in: path
          name: email
          required: true
          description: Email address of the user to delete.
          schema:
            type: string
            format: email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /assets/menus/{filename}:
    get:
      tags:
        - Assets
      summary: Retrieve a menu image by filename
      operationId: getMenuImage
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: The filename of the menu image (e.g., espresso.png)
      responses:
        '200':
          description: Menu image file
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          description: Menu image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /assets/recipes/{filename}:
    get:
      tags:
        - Assets
      summary: Retrieve a recipe file by filename
      operationId: getRecipe
      parameters:
        - in: path
          name: filename
          required: true
          schema:
            type: string
          description: The filename of the recipe document
      responses:
        '200':
          description: Recipe file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Recipe not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    BranchToken:
      in: header
      name: Branch-Token
      required: true
      description: JWT token for branch authorization obtained from /branches/signin.
      schema:
        type: string
  schemas:
    ApiError:
      type: object
      description: Error response payload.
      properties:
        error:
          type: string
          description: Error message describing what went wrong.
        message:
          type: string
          description: Additional context about the error.
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong.
        message:
          type: string
          description: Additional context about the error.
    SimpleMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Human readable message.
    CreateBranchRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          description: Password for the new branch.
    SignInBranchRequest:
      type: object
      required:
        - branchId
        - password
      properties:
        branchId:
          type: integer
          format: int64
          description: Branch identifier.
        password:
          type: string
          minLength: 1
          description: Password for the branch.
    SignInBranchResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
          description: JWT token for subsequent authenticated requests.
    InsightSalesTodayResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          type: integer
          format: int32
          minimum: 0
          description: Number of orders placed today.
    TopMenuInsightItem:
      type: object
      required:
        - menuName
        - totalQuantity
      properties:
        menuName:
          type: string
        totalQuantity:
          type: integer
          format: int32
          minimum: 0
    TopMenuInsightChart:
      type: object
      required:
        - labels
        - data
      properties:
        labels:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
    InsightTopMenusResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/TopMenuInsightItem'
            - $ref: '#/components/schemas/TopMenuInsightChart'
    InsightSeries:
      type: object
      required:
        - labels
        - data
      properties:
        labels:
          type: array
          items:
            type: string
        data:
          type: array
          items:
            type: integer
            format: int32
            minimum: 0
    InsightSalesSeriesResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          $ref: '#/components/schemas/InsightSeries'
    SalesByCategoryItem:
      type: object
      required:
        - label
        - data
      properties:
        label:
          type: string
        data:
          type: array
          maxItems: 12
          items:
            type: integer
            format: int32
            minimum: 0
    InsightSalesByCategoryResponse:
      type: object
      required:
        - message
        - insight
      properties:
        message:
          type: string
        insight:
          type: array
          items:
            $ref: '#/components/schemas/SalesByCategoryItem'
    MenuSummary:
      type: object
      required:
        - id
        - name
        - price
        - fileName
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: float
          minimum: 0
        fileName:
          type: string
    MenuListResponse:
      type: object
      required:
        - message
        - menus
      properties:
        message:
          type: string
        menus:
          type: array
          items:
            $ref: '#/components/schemas/MenuSummary'
    MenuResponse:
      type: object
      required:
        - message
        - menu
      properties:
        message:
          type: string
        menu:
          $ref: '#/components/schemas/MenuSummary'
    EditMenuRequest:
      type: object
      required:
