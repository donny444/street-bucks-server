    EditQuantityWithEditorRequest:
      type: object
      required:
        - recipeId
        - quantity
        - editor
      properties:
        recipeId:
          type: integer
          format: int64
          description: Recipe identifier for the stock item.
        quantity:
          type: integer
          format: int32
          minimum: 0
          description: New quantity for the stock.
        editor:
          $ref: '#/components/schemas/EditorCredentials'
          description: Manager credentials required for authorization.
    RegisterUserRequest:
      type: object
      required:
        - email
